<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="Val Ark: How the Librarian fills a disk"><title>Val Ark: How the Librarian fills a disk</title><desc>Animated diagram: How the Librarian fills a disk. Parts: Catalogs, Candidates, 0 Essentials, 1 Diversity, 2 Small, 3 Fill, Download, Data disk, Trade up. Four passes, most important first, until the disk reaches its reserve.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#111a24"/><stop offset="1" stop-color="#0d1117"/></linearGradient></defs><style>
.s{fill:none;stroke:var(--a);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.t{stroke-width:2}.w{stroke-width:6}.f{fill:var(--a)}
.lb{font:600 15px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#e6edf3;text-anchor:middle}
.cp{font:12px system-ui,sans-serif;fill:#9aa7b4;text-anchor:middle}
