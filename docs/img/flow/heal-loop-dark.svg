-11v27" class="s t"/></g><text x="1007.0" y="515.0" class="lb">Refresh</text><text x="1007.0" y="532.0" class="cp">live catalogs</text></g><rect x="927.0" y="447.0" width="160" height="102" rx="15" class="pl" style="animation-delay:2.03s"/><g class="nd" style="animation-delay:0.80s"><rect x="760.0" y="536.9" width="150" height="92" rx="12" fill="#18212c" stroke="#3a4a5e" stroke-width="1.5"/><rect x="760.0" y="536.9" width="6" height="92" rx="3" fill="#14b8a6"/><g transform="translate(835.0 564.9) scale(.72)" style="--a:#14b8a6"><circle cx="-4" cy="-4" r="11" class="s"/><path d="m4 4 11 11" class="s w"/></g><text x="835.0" y="599.9" class="lb">Fix dead links</text><text x="835.0" y="616.9" class="cp">tool, installer URLs</text></g><rect x="755.0" y="531.9" width="160" height="102" rx="15" class="pl" style="animation-delay:2.71s"/><g class="nd" style="animation-delay:0.92s"><rect x="525.0" y="568.0" width="150" height="92" rx="12" fill="#18212c" stroke="#3a4a5e" stroke-width="1.5"/><rect x="525.0" y="568.0" width="6" height="92" rx="3" fill="#eab308"/><g transform="translate(600.0 596.0) scale(.72)" style="--a:#eab308"><circle r="16" class="s"/><path d="m-7 0 5 6 10-11" class="s"/></g><text x="600.0" y="631.0" class="lb">Check files</text><text x="600.0" y="648.0" class="cp">sizes, re-fetch short</text></g><rect x="520.0" y="563.0" width="160" height="102" rx="15" class="pl" style="animation-delay:3.55s"/><g class="nd" style="animation-delay:1.04s"><rect x="290.0" y="536.9" width="150" height="92" rx="12" fill="#18212c" stroke="#3a4a5e" stroke-width="1.5"/><rect x="290.0" y="536.9" width="6" height="92" rx="3" fill="#ec4899"/><g transform="translate(365.0 564.9) scale(.72)" style="--a:#ec4899"><rect x="-19" y="-14" width="38" height="28" rx="5" class="s"/><path d="M-5-7v14l11-7z" class="f"/></g><text x="365.0" y="599.9" class="lb">Top up</text><text x="365.0" y="616.9" class="cp">pins, then fill</text></g><rect x="285.0" y="531.9" width="160" height="102" rx="15" clas