<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-label="Val Ark: The self-healing loop"><title>Val Ark: The self-healing loop</title><desc>Animated diagram: The self-healing loop. Parts: Repair links, Web up, Refresh, Verify files, Copy itself, Top up, Update apps, Does it run?, Safety sweep. Every 30 minutes, and after a reboot, the Ark checks itself and fixes what it can.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#111a24"/><stop offset="1" stop-color="#0d1117"/></linearGradient></defs><style>
.s{fill:none;stroke:var(--a);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.t{stroke-width:2}.w{stroke-width:6}.f{fill:var(--a)}
.lb{font:600 15px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#e6edf3;text-anchor:middle}
.cp{font:12px system-ui,sans-serif;fill:#9aa7b4;text-anchor:middle}
.el{font:italic 12px system-ui,sans-serif;fill:#9aa7b4}
.zt{font:700 11px system-ui,sans-serif;letter-spacing:.18em;fill:#9aa7b4;text-transform:uppercase}
.ch{font:700 12px system-ui,sans-serif;letter-spacing:.22em;fill:#f59e0b;text-transform:uppercase}
.tt{font:italic 600 30px Georgia,'Times New Roman',serif;fill:#e6edf3}
.st{font:16px system-ui,sans-serif;fill:#9aa7b4}
.nd{transform-box:fill-box;transform-origin:50% 50%;animation:pop .6s cubic-bezier(.3,1.4,.5,1) both}
.ar{fill:none;stroke:#9aa7b4;stroke-width:2;opacity:.75;stroke-dasharray:1;animation:draw .8s ease-out both}
.ah{fill:#9aa7b4;opacity:.75;animation:fade .4s ease-out both}
.dot{fill:#f59e0b;animation:run 3.2s linear infinite both}
.pl{fill:none;stroke:#f59e0b;stroke-width:3;opacity:0;animation:pulse 8s ease-in-out infinite}
.spin{transform-box:fill-box;transform-origin:50% 50%;animation:spin 8s linear infinite}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:none;opacity:1}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes fade{from{opacity:0}}
@keyframes run{0%{offset-distance:0%;opacity:0}8%,88%{opacity:1}100%{offset-distance:100%;opacity:0}}
@keyframes pulse{0%,14%,100%{opacity:0}4%,9%{opacity:.95}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.dot{display:none}}
</style><rect width="1200" height="540" rx="18" fill="url(#bg)"/><text x="64" y="44" class="ch">How it works</text><text x="64" y="80" class="tt">The self-healing loop</text><text x="1136" y="44" class="st" text-anchor="end">Every 30 minutes, and after a reboot, the Ark checks itself and fixes what it can.</text><ellipse cx="600" cy="315" rx="279" ry="180" fill="none" stroke="#2f3e50" stroke-width="10" opacity=".7"/><circle r="6" class="dot" style="offset-path:path('M600 135A279 180 0 1 1 599.9 135');animation-duration:8s;animation-delay:0.00s"/><circle r="6" class="dot" style="offset-path:path('M600 135A279 180 0 1 1 599.9 135');animation-duration:8s;animation-delay:-2.67s"/><circle r="6" class="dot" style="offset-path:path('M600 135A279 180 0 1 1 599.9 135');animation-duration:8s;animation-delay:-5.33s"/><g class="spin" style="--a:#f59e0b"><g transform="translate(600 301) scale(1.6)"><polygon points="16.8,-2.9 16.8,2.9 11.7,2.7 10.1,6.4 13.9,9.8 9.8,13.9 6.4,10.1 2.7,11.7 2.9,16.8 -2.9,16.8 -2.7,11.7 -6.4,10.1 -9.8,13.9 -13.9,9.8 -10.1,6.4 -11.7,2.7 -16.8,2.9 -16.8,-2.9 -11.7,-2.7 -10.1,-6.4 -13.9,-9.8 -9.8,-13.9 -6.4,-10.1 -2.7,-11.7 -2.9,-16.8 2.9,-16.8 2.7,-11.7 6.4,-10.1 9.8,-13.9 13.9,-9.8 10.1,-6.4 11.7,-2.7" class="s"/><circle r="5" class="f"/></g></g><text x="600" y="349" class="lb">loop.sh</text><text x="600" y="367" class="cp">every 30 min</text><g class="nd" style="animation-delay:0.20s"><rect x="525.0" y="89.0" width="150" height="92" rx="12" fill="#18212c" stroke="#3a4a5e" stroke-width="1.5"/><rect x="525.0" y="89.0" width="6" height="92" rx="3" fill="#f97316"/><g transform="translate(600.0 117.0) scale(.72)" style="--a:#f97316"><path d="M-4-4 13 13" class="s w"/><circle cx="-9" cy="-9" r="8" class="s"/><path d="m-13-13 5 5" class="s"/></g><text x="600.0" y="152.0" class="lb">Repair links</text><text x="600.0" y="169.0" class="cp">symlinks back</text></g><rect x="520.0" y="84.0" width="160" height="102" rx="15" class="pl" style="animation-delay:0.00s"/><g class="nd" style="animation-delay:0.32s"><rect x="704.3" y="131.1" width="150" height="92" rx="12" fill="#18212c" stroke="#3a4a5e" stroke-width="1.5"/><rect x="704.3" y="131.1" width="6" height="92" rx="3" fill="#22c55e"/><g transform="translate(779.3 159.1) scale(.72)" style="--a:#22c55e"><circle r="16" class="s"/><ellipse rx="7" ry="16" class="s"/><path d="M-16 0h32M-13-9h26M-13 9h26" class="s t"/></g><text x="779.3" y="194.1" class="lb">Web up</text><text x="779.3" y="211.1" class="cp">server, services</text></g><rect x="699.3" y="126.1" width="160" height="102" rx="15" class="pl" style="animation-delay:0.89s"/><g class="nd" style="animation-delay:0.44s"><rect x="799.8" y="237.7" width="150" height="92" rx="12" fill="#18212c" stroke="#3a4a5e" stroke-width="1.5"/><rect x="799.8" y="237.7" width="6" height="92" rx="3" fill="#3b82f6"/><g transform="translate(874.8 265.7) scale(.72)" style="--a:#3b82f6"><path d="m-19-11 12-5 14 5 12-5v27l-12 5-14-5-12 5z" class="s"/><path d="M-7-16v27M7-11v27" class="s t"/></g><text x="874.8" y="300.7" class="lb">Refresh</text><text x="874.8" y="317.7" class="cp">live catalogs</text></g><rect x="794.8" y="232.7" width="160" height="102" rx="15" class="pl" style="animation-delay:1.78s"/><g class="nd" style="animation-delay:0.56s"><rect x="766.6" y="359.0" width="150" height="92" rx="12" fill="#18212c" stroke="#3a4a5e" stroke-width="1.5"/><rect x="766.6" y="359.0" width="6" height="92" rx="3" fill="#a855f7"/><g transform="translate(841.6 387.0) scale(.72)" style="--a:#a855f7"><circle r="16" class="s"/><path d="m-7 0 5 6 10-11" class="s"/></g><text x="841.6" y="422.0" class="lb">Verify files</text><text x="841.6" y="439.0" class="cp">sizes and hashes</text></g><rect x="761.6" y="354.0" width="160" height="102" rx="15" class="pl" style="animation-delay:2.67s"/><g class="nd" style="animation-delay:0.68s"><rect x="620.4" y="438.1" width="150" height="92" rx="12" fill="#18212c" stroke="#3a4a5e" stroke-width="1.5"/><rect x="620.4" y="438.1" width="6" height="92" rx="3" fill="#ef4444"/><g transform="translate(695.4 466.1) scale(.72)" style="--a:#ef4444"><path d="M-20 4h40l-7 11h-26z" class="s"/><path d="M0 4v-21M0-17l13 17H0" class="s"/><path d="M-22 18c4-3 8-3 11 0s8 3 11 0 8-3 11 0 7 3 11 0" class="s t"/></g><text x="695.4" y="501.1" class="lb">Copy itself</text><text x="695.4" y="518.1" class="cp">for new nodes</text></g><rect x="615.4" y="433.1" width="160" height="102" rx="15" class="pl" style="animation-delay:3.56s"/><g class="nd" style="animation-delay:0.80s"><rect x="429.6" y="438.1" width="150" height="92" rx="12" fill="#18212c" stroke="#3a4a5e" stroke-width="1.5"/><rect x="429.6" y="438.1" width="6" height="92" rx="3" fill="#3b82f6"/><g transform="translate(504.6 466.1) scale(.72)" style="--a:#3b82f6"><path d="M-16-11v22a16 5 0 0 0 32 0v-22" class="s"/><ellipse cy="-11" rx="16" ry="5" class="s"/><path d="M-16 0a16 5 0 0 0 32 0" class="s"/><circle cx="10" cy="8" r="2" class="f"/></g><text x="504.6" y="501.1" class="lb">Top up</text><text x="504.6" y="518.1" class="cp">pins, then fill</text></g><rect x="424.6" y="433.1" width="160" height="102" rx="15" class="pl" style="animation-delay:4.44s"/><g class="nd" style="animation-delay:0.92s"><rect x="283.4" y="359.0" width="150" height="92" rx="12" fill="#18212c" stroke="#3a4a5e" stroke-width="1.5"/><rect x="283.4" y="359.0" width="6" height="92" rx="3" fill="#14b8a6"/><g transform="translate(358.4 387.0) scale(.72)" style="--a:#14b8a6"><path d="M0-17 15-9v17L0 17l-15-9V-9z" class="s"/><path d="M-15-9 0-1 15-9M0-1v18" class="s"/></g><text x="358.4" y="422.0" class="lb">Update apps</text><text x="358.4" y="439.0" class="cp">weekly</text></g><rect x="278.4" y="354.0" width="160" height="102" rx="15" class="pl" style="animation-delay:5.33s"/><g class="nd" style="animation-delay:1.04s"><rect x="250.2" y="237.7" width="150" height="92" rx="12" fill="#18212c" stroke="#3a4a5e" stroke-width="1.5"/><rect x="250.2" y="237.7" width="6" height="92" rx="3" fill="#eab308"/><g transform="translate(325.2 265.7) scale(.72)" style="--a:#eab308"><rect x="-19" y="-14" width="38" height="28" rx="5" class="s"/><path d="M-5-7v14l11-7z" class="f"/></g><text x="325.2" y="300.7" class="lb">Does it run?</text><text x="325.2" y="317.7" class="cp">tools, LLM, API</text></g><rect x="245.2" y="232.7" width="160" height="102" rx="15" class="pl" style="animation-delay:6.22s"/><g class="nd" style="animation-delay:1.16s"><rect x="345.7" y="131.1" width="150" height="92" rx="12" fill="#18212c" stroke="#3a4a5e" stroke-width="1.5"/><rect x="345.7" y="131.1" width="6" height="92" rx="3" fill="#ec4899"/><g transform="translate(420.7 159.1) scale(.72)" style="--a:#ec4899"><path d="M0-18 15-12V0c0 10-7 16-15 19-8-3-15-9-15-19v-12z" class="s"/><path d="m-6 1 4 5 9-10" class="s"/></g><text x="420.7" y="194.1" class="lb">Safety sweep</text><text x="420.7" y="211.1" class="cp">new uploads</text></g><rect x="340.7" y="126.1" width="160" height="102" rx="15" class="pl" style="animation-delay:7.11s"/></svg>
