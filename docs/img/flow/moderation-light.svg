<text x="143.0" y="217.0" class="lb">Uploads folder</text><text x="143.0" y="234.0" class="cp">VAL_ARK_UPLOADS</text></g><g class="nd" style="animation-delay:0.28s"><rect x="68.0" y="354.0" width="150" height="92" rx="12" fill="#ffffff" stroke="#d9c9ae" stroke-width="1.5"/><rect x="68.0" y="354.0" width="6" height="92" rx="3" fill="#22c55e"/><g transform="translate(143.0 382.0) scale(.72)" style="--a:#22c55e"><circle r="16" class="s"/><path d="m-7 0 5 6 10-11" class="s"/></g><text x="143.0" y="417.0" class="lb">Stays shared</text><text x="143.0" y="434.0" class="cp">nothing found</text></g><g class="nd" style="animation-delay:0.36s"><rect x="315.0" y="154.0" width="150" height="92" rx="12" fill="#ffffff" stroke="#d9c9ae" stroke-width="1.5"/><rect x="315.0" y="154.0" width="6" height="92" rx="3" fill="#3b82f6"/><g transform="translate(390.0 182.0) scale(.72)" style="--a:#3b82f6"><circle cx="-4" cy="-4" r="11" class="s"/><path d="m4 4 11 11" class="s w"/></g><text x="390.0" y="217.0" class="lb">Sweep</text><text x="390.0" y="234.0" class="cp">new files only</text></g><g class="nd" style="animation-delay:0.44s"><rect x="535.0" y="154.0" width="150" height="92" rx="12" fill="#ffffff" stroke="#d9c9ae" stroke-width="1.5"/><rect x="535.0" y="154.0" width="6" height="92" rx="3" fill="#a855f7"/><g transform="translate(610.0 182.0) scale(.72)" style="--a:#a855f7"><rect x="-12" y="-12" width="24" height="24" rx="3" class="s"/><rect x="-5" y="-5" width="10" height="10" class="f"/><path d="M-7-12v-6M0-12v-6M7-12v-6M-7 12v6M0 12v6M7 12v6M-12-7h-6M-12 0h-6M-12 7h-6M12-7h6M12 0h6M12 7h6" class="s t"/></g><text x="610.0" y="217.0" class="lb">Local model</text><text x="610.0" y="234.0" class="cp">text and images</text></g><g class="nd" style="animation-delay:0.52s"><rect x="755.0" y="154.0" width="150" height="92" rx="12" fill="#ffffff" stroke="#d9c9ae" stroke-width="1.5"/><rect x="755.0" y="154.0" width="6" height="92" rx="3" fill="#ef4444"/><g transform="translate(830.0 182.0) scal