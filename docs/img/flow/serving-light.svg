<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="Val Ark: Two ways to open an Ark"><title>Val Ark: Two ways to open an Ark</title><desc>Animated diagram: Two ways to open an Ark. Parts: Data disk, librarian site, File share, server.js, Live features, Any device, Your LAN. Static pages on any file share, or the live web server. Both work fully offline.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdf8ef"/><stop offset="1" stop-color="#f5ecdb"/></linearGradient></defs><style>
.s{fill:none;stroke:var(--a);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.t{stroke-width:2}.w{stroke-width:6}.f{fill:var(--a)}
.lb{font:600 15px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#1f2328;text-anchor:middle}
.cp{font:12px system-ui,sans-serif;fill:#59636e;text-anchor:middle}
.el{font:italic 12px system-ui,sans-serif;fill:#59636e;stroke:#fffdf8;stroke-width:4px;paint-order:stroke;stroke-linejoin:round}
.zt{font:700 11px system-ui,sans-serif;letter-spacing:.18em;fill:#59636e;text-transform:uppercase}
.ch{font:700 12px system-ui,sans-serif;letter-spacing:.22em;fill:#f59e0b;text-transform:uppercase}
.tt{font:italic 600 30px Georgia,'Times New Roman',serif;fill:#1f2328}
.st{font:16px system-ui,sans-serif;fill:#59636e}
.nd{transform-box:fill-box;transform-origin:50% 50%;animation:pop .6s cubic-bezier(.3,1.4,.5,1) both}
.ar{fill:none;stroke:#59636e;stroke-width:2;opacity:.75;stroke-dasharray:1;animation:draw .8s ease-out both}
.ah{fill:#59636e;opacity:.75;animation:fade .4s ease-out both}
.dot{fill:#f59e0b;stroke:#fffdf8;stroke-width:1.5px;animation:run 3.2s linear infinite both}
.pl{fill:none;stroke:#f59e0b;stroke-width:3;opacity:0;animation:pulse 8s ease-in-out infinite}
.spin{transform-box:fill-box;transform-origin:50% 50%;animation:spin 8s linear infinite}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:none;opacity:1}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes fade{from{opacity:0}}
@keyframes run{0%{offset-distance:0%;opacity:0}8%,88%{opacity:1}100%{offset-distance:100%;opacity:0}}
@keyframes pulse{0%,14%,100%{opacity:0}4%,9%{opacity:.95}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.dot{display:none}}
@supports not (offset-path:path('M0 0')){.dot{display:none}}
