<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-label="Val Ark: How an Ark works, end to end"><title>Val Ark: How an Ark works, end to end</title><desc>Animated diagram: How an Ark works, end to end. Parts: Kiwix library, Model hubs, Releases, Librarian, Loop, Data disk, Web server, Static pages, People, File share. Fetch once from the internet, keep it healthy on one disk, share it on the LAN.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#111a24"/><stop offset="1" stop-color="#0d1117"/></linearGradient></defs><style>
.s{fill:none;stroke:var(--a);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.t{stroke-width:2}.w{stroke-width:6}.f{fill:var(--a)}
.lb{font:600 15px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#e6edf3;text-anchor:middle}
