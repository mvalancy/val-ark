<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Val Ark: How the Ark is built"><title>Val Ark: How the Ark is built</title><desc>Pop-up book scene for Chapter 1: How the Ark is built. Paper cut-outs for .env, start.sh, loop.sh, Librarian, server.js, Web UI unfold from the spine of an open book, then fold flat and repeat. One config, two entry points, a librarian and a zero-dependency web server.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#111a24"/><stop offset="1" stop-color="#0d1117"/></linearGradient></defs><style>
