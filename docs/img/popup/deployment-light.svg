<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Val Ark: Shipping it safely"><title>Val Ark: Shipping it safely</title><desc>Pop-up book scene for Design: Shipping it safely. Paper cut-outs for Native, Docker, Hardened, Self-copy, Reliable unfold from the spine of an open book, then fold flat and repeat. Native or Docker, locked down and reliable, still offline and self-copying.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdf8ef"/><stop offset="1" stop-color="#f5ecdb"/></linearGradient></defs><style>
.s{fill:none;stroke:var(--a);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.t{stroke-width:2}.w{stroke-width:6}.f{fill:var(--a)}
.lb{font:600 16px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#1f2328;text-anchor:middle}
.bd{font:700 13px system-ui,sans-serif;fill:#fff;text-anchor:middle}
