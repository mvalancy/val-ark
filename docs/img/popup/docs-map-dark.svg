<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Val Ark: Every page of the Ark"><title>Val Ark: Every page of the Ark</title><desc>Pop-up book scene for The Map: Every page of the Ark. Paper cut-outs for Start here, Architecture, Librarian, Design, Knowledge, Tests unfold from the spine of an open book, then fold flat and repeat. Start here, then follow the paths to any guide.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#111a24"/><stop offset="1" stop-color="#0d1117"/></linearGradient></defs><style>
