<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Val Ark: The Librarian fills the shelves"><title>Val Ark: The Librarian fills the shelves</title><desc>Pop-up book scene for Chapter 2: The Librarian fills the shelves. Paper cut-outs for Diversity, Small + valuable, Fill the rest, Evict for better unfold from the spine of an open book, then fold flat and repeat. Essentials first, then diversity, small and valuable, fill, then trade up.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#111a24"/><stop offset="1" stop-color="#0d1117"/></linearGradient></defs><style>
