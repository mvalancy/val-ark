<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Val Ark: The Ark on an arm64 NAS"><title>Val Ark: The Ark on an arm64 NAS</title><desc>Pop-up book scene for Appendix: The Ark on an arm64 NAS. Paper cut-outs for NAS box, RK3588, NPU, LAN unfold from the spine of an open book, then fold flat and repeat. Boxes built on chips such as the Rockchip RK3588: setup notes and fixes.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#111a24"/><stop offset="1" stop-color="#0d1117"/></linearGradient></defs><style>
