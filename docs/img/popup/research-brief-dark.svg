<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Val Ark: What we learned first"><title>Val Ark: What we learned first</title><desc>Pop-up book scene for Design: What we learned first. Paper cut-outs for NAS boxes, Home hubs, Routers, Health apps, Findings unfold from the spine of an open book, then fold flat and repeat. Eight research tracks, from NAS boxes to fitness apps, boiled down to advice.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#111a24"/><stop offset="1" stop-color="#0d1117"/></linearGradient></defs><style>
