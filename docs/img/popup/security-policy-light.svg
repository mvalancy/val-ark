path d="M541.7 213.0C610.0 195.0 610.0 195.0 678.3 213.0" pathLength="1" class="ln" style="animation-delay:2.40s"/><path d="M541.7 213.0C610.0 195.0 610.0 195.0 678.3 213.0" class="fl" style="animation-delay:0s,2.40s"/><path d="M828.3 213.0C896.7 195.0 896.7 195.0 965.0 213.0" pathLength="1" class="ln" style="animation-delay:2.52s"/><path d="M828.3 213.0C896.7 195.0 896.7 195.0 965.0 213.0" class="fl" style="animation-delay:0s,2.52s"/><g transform="translate(203 138) scale(0.48)"><g class="tw" style="animation-delay:1.41s;--a:#d97706"><path d="M0-16 4-4 16 0 4 4 0 16-4 4-16 0-4-4z" class="f"/></g></g><g transform="translate(422 108) scale(0.45)"><g class="tw" style="animation-delay:0.39s;--a:#d97706"><path d="M0-16 4-4 16 0 4 4 0 16-4 4-16 0-4-4z" class="f"/></g></g><g transform="translate(264 111) scale(0.43)"><g class="tw" style="animation-delay:1.03s;--a:#d97706"><path d="M0-16 4-4 16 0 4 4 0 16-4 4-16 0-4-4z" class="f"/></g></g><g transform="translate(575 127) scale(0.55)"><g class="tw" style="animation-delay:2.65s;--a:#d97706"><path d="M0-16 4-4 16 0 4 4 0 16-4 4-16 0-4-4z" class="f"/></g></g><g transform="translate(988 122) scale(0.43)"><g class="tw" style="animation-delay:2.57s;--a:#d97706"><path d="M0-16 4-4 16 0 4 4 0 16-4 4-16 0-4-4z" class="f"/></g></g><g transform="translate(561 143) scale(0.41)"><g class="tw" style="animation-delay:2.13s;--a:#d97706"><path d="M0-16 4-4 16 0 4 4 0 16-4 4-16 0-4-4z" class="f"/></g></g><g transform="translate(217 127) scale(0.59)"><g class="tw" style="animation-delay:0.62s;--a:#d97706"><path d="M0-16 4-4 16 0 4 4 0 16-4 4-16 0-4-4z" class="f"/></g></g><g class="tab"><rect x="1100" y="278" width="58" height="24" rx="6" fill="#f59e0b"/><path d="M1138 284l-9 6 9 6M1148 284l-9 6 9 6" fill="none" stroke="#2a1a04" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g></svg>
