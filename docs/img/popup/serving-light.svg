<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Val Ark: Two ways to serve"><title>Val Ark: Two ways to serve</title><desc>Pop-up book scene for Chapter 8: Two ways to serve. Paper cut-outs for Plain files, Static pages, File share, server.js, Live web UI, Chat + mail unfold from the spine of an open book, then fold flat and repeat. Static pages on any file share, or a live server with chat, mail and requests.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdf8ef"/><stop offset="1" stop-color="#f5ecdb"/></linearGradient></defs><style>
.s{fill:none;stroke:var(--a);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.t{stroke-width:2}.w{stroke-width:6}.f{fill:var(--a)}
.lb{font:600 16px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#1f2328;text-anchor:middle}
.bd{font:700 13px system-ui,sans-serif;fill:#fff;text-anchor:middle}
