<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Val Ark: Proving it works"><title>Val Ark: Proving it works</title><desc>Pop-up book scene for Proof: Proving it works. Paper cut-outs for Validators, Playwright, Fresh VMs, Report unfold from the spine of an open book, then fold flat and repeat. Validators, browser tests and fresh-VM installs, in one offline report.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#111a24"/><stop offset="1" stop-color="#0d1117"/></linearGradient></defs><style>
.s{fill:none;stroke:var(--a);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.t{stroke-width:2}.w{stroke-width:6}.f{fill:var(--a)}
.lb{font:600 16px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#e6edf3;text-anchor:middle}
.bd{font:700 13px system-ui,sans-serif;fill:#fff;text-anchor:middle}
.ch{font:700 12px system-ui,sans-serif;letter-spacing:.22em;fill:#f59e0b;text-transform:uppercase}
.tt{font:italic 600 30px Georgia,'Times New Roman',serif;fill:#e6edf3}
.st{font:16px system-ui,sans-serif;fill:#9aa7b4}
.pop,.lay{transform-box:fill-box;transform-origin:50% 100%;animation:pop 14.0s cubic-bezier(.3,1.4,.5,1) infinite backwards}
.sw{transform-box:fill-box;transform-origin:50% 100%;animation:sway 4s ease-in-out infinite alternate}
.sh{transform-box:fill-box;transform-origin:50% 50%;animation:shade 14.0s ease-out infinite backwards}
.ln{fill:none;stroke:#9aa7b4;stroke-width:2;stroke-dasharray:1;opacity:.55;animation:draw 14.0s ease-in-out infinite backwards}
.fl{fill:none;stroke:#f59e0b;stroke-width:3;stroke-linecap:round;stroke-dasharray:2 16;
     animation:flow 1.1s linear infinite,show 14.0s linear infinite backwards}
.tab{animation:tab 14.0s ease-in-out infinite}
.tw{transform-box:fill-box;transform-origin:50% 50%;animation:tw 2.8s ease-in-out infinite}
@keyframes pop{0%{transform:scaleY(.02);opacity:0}1%{opacity:1}5%{transform:scaleY(1.08)}7%{transform:scaleY(.97)}9%,86%{transform:none;opacity:1}
  91%,100%{transform:scaleY(.02);opacity:0}}
@keyframes shade{0%{transform:scaleX(.2);opacity:0}6%,86%{transform:none;opacity:1}91%,100%{transform:scaleX(.2);opacity:0}}
@keyframes sway{from{transform:rotate(-.8deg)}to{transform:rotate(.8deg)}}
@keyframes draw{0%{stroke-dashoffset:1}8%,70%{stroke-dashoffset:0}76%,100%{stroke-dashoffset:1}}
@keyframes show{0%,8%{opacity:0}12%,68%{opacity:.9}73%,100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-18}}
@keyframes tab{0%,1%{transform:none}5%{transform:translateX(-30px)}10%,84%{transform:none}88%{transform:translateX(-16px)}92%,100%{transform:none}}
@keyframes tw{0%,100%{transform:scale(.3);opacity:.2}50%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.fl{opacity:0}}
