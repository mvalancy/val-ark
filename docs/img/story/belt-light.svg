"2"/><g transform="translate(610.0 296.0) scale(1.2)" style="--a:#a855f7"><rect x="-12" y="-12" width="24" height="24" rx="3" class="s"/><rect x="-5" y="-5" width="10" height="10" class="f"/><path d="M-7-12v-6M0-12v-6M7-12v-6M-7 12v6M0 12v6M7 12v6M-12-7h-6M-12 0h-6M-12 7h-6M12-7h6M12 0h6M12 7h6" class="s t"/></g><circle cx="610" cy="190" r="9" fill="#f59e0b" class="tw" style="animation-duration:1.6s"/><rect x="548" y="386" width="124" height="56" rx="6" fill="#dccdb0"/><text x="610.0" y="409.0" class="sm m">A local model</text><text x="610.0" y="427.0" class="xs m">text and images</text><text x="610.0" y="136.0" class="it h m">Checked on the box.</text><text x="610.0" y="156.0" class="it h m">Nothing is sent anywhere.</text><path d="M700 290C780 290 800 214 880 214" fill="none" stroke="#22c55e" stroke-width="5" stroke-linecap="round" opacity=".55"/><path d="M700 330C780 330 800 420 880 420" fill="none" stroke="#ef4444" stroke-width="5" stroke-linecap="round" opacity=".55"/><circle r="7" fill="#22c55e" class="go" style="offset-path:path('M700 290C780 290 800 214 880 214');animation-duration:4s;animation-delay:0s"/><circle r="7" fill="#ef4444" class="go" style="offset-path:path('M700 330C780 330 800 420 880 420');animation-duration:4s;animation-delay:1s"/><circle r="7" fill="#22c55e" class="go" style="offset-path:path('M700 290C780 290 800 214 880 214');animation-duration:4s;animation-delay:2s"/><circle r="7" fill="#ef4444" class="go" style="offset-path:path('M700 330C780 330 800 420 880 420');animation-duration:4s;animation-delay:3s"/><text x="790.0" y="236.0" class="xs h m">clean</text><text x="784.0" y="398.0" class="xs h m">flagged, unsure</text><text x="784.0" y="412.0" class="xs h m">or an error</text><path d="M884 242H1010" stroke="#1f2328" stroke-width="5" stroke-linecap="round"/><path d="M896-14h12l6 6v20h-18Z" transform="translate(0 222)" fill="#fff8e7" stroke="#22c55e" stroke-width="2"/><path d="M926-14h12l6 6v20h-18Z" transform="translate(0 222)" fill="#fff8e7" stroke="#22c55e" stroke-width="2"/><path d="M956-14h12l6 6v20h-18Z" transform="translate(0 222)" fill="#fff8e7" stroke="#22c55e" stroke-width="2"/><g transform="translate(1040.0 216.0) scale(0.8)" style="--a:#22c55e"><circle r="16" class="s"/><path d="m-7 0 5 6 10-11" class="s"/></g><text x="950.0" y="268.0" class="lb h m">Stays shared</text><text x="950.0" y="287.0" class="cp h m">nothing found</text><rect x="892" y="386" width="92" height="70" rx="6" fill="#dccdb0" stroke="#ef4444" stroke-width="3"/><g transform="translate(938.0 420.0) scale(0.95)" style="--a:#ef4444"><rect x="-14" y="-3" width="28" height="21" rx="4" class="s"/><path d="M-8-3v-6a8 8 0 0 1 16 0v6" class="s"/><circle cy="6" r="3" class="f"/><path d="M0 8v5" class="s"/></g><text x="938.0" y="480.0" class="lb h m">Quarantine</text><text x="938.0" y="499.0" class="cp h m">set aside, not deleted</text><path d="M990 420H1082" class="ld"/><g transform="translate(1118.0 420.0) scale(1.1)" style="--a:#eab308"><path d="M-19 0C-12-11 12-11 19 0 12 11-12 11-19 0z" class="s"/><circle r="5" class="f"/></g><text x="1118.0" y="480.0" class="lb h m">The Admin</text><text x="1118.0" y="499.0" class="cp h m">removes or dismisses</text></g><text x="56" y="46" class="ch h">Chapter 9</text><text x="56" y="82" class="tt h">The sorting machine</text></svg>
