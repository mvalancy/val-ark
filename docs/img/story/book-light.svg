roke-linecap="round" class="ring" style="animation-delay:0.0s"/><path d="M756 256A56 56 0 0 1 756 336" fill="none" stroke="#f97316" stroke-width="3" stroke-linecap="round" class="ring" style="animation-delay:0.4s"/><path d="M767 245A72 72 0 0 1 767 347" fill="none" stroke="#f97316" stroke-width="3" stroke-linecap="round" class="ring" style="animation-delay:0.8s"/><rect x="866" y="244" width="50" height="92" rx="8" fill="#1f2328"/><rect x="871" y="252" width="40" height="72" rx="3" fill="#fdf6e6"/><rect x="877" y="260" width="28" height="22" rx="3" fill="#22c55e" opacity=".5"/><rect x="877" y="290" width="28" height="9" rx="4" fill="#f59e0b" class="tw" style="animation-delay:-2s"/><rect x="945" y="245" width="140" height="90.6" rx="7" fill="#1f2328"/><rect x="950" y="250" width="130" height="81" rx="3" fill="#fdf6e6"/><g transform="translate(950 250)"><circle cx="16" cy="12" r="4" fill="#4b5563"/><circle cx="30" cy="12" r="4" fill="#4b5563"/><circle cx="44" cy="12" r="4" fill="#4b5563"/><circle cx="58" cy="12" r="4" fill="#4b5563"/><rect x="10" y="24" width="52" height="42" rx="4" fill="#3b82f6" opacity=".5"/><rect x="68" y="24" width="52" height="42" rx="4" fill="#a855f7" opacity=".5"/><rect x="74" y="52" width="40" height="9" rx="4" fill="#f59e0b" class="tw"/></g><path d="M928 336h174l-8 11h-158Z" fill="#1f2328"/><text x="716.0" y="386.0" class="sm m">The Ark, switched on</text><text x="970.0" y="386.0" class="sm m">Phones and laptops nearby</text><text x="650.0" y="428.0" class="cp">The web server shows the whole library in a browser.</text><text x="650.0" y="450.0" class="cp">Request more, chat, send mail, ask the assistant.</text><text x="650.0" y="472.0" class="cp">Open to your LAN and tailnet, never to the internet.</text></g><text x="1144.0" y="82.0" class="it h e">Both work with no internet at all.</text><text x="56" y="46" class="ch h">Chapter 4</text><text x="56" y="82" class="tt h">Two ways in</text></svg>
