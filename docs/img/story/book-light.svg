<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="Val Ark: Two ways in"><title>Val Ark: Two ways in</title><desc>An open book. Left page, the side door: the Librarian writes plain HTML pages onto the data disk; open them on any device from an SMB or NFS share or a USB stick, with no server needed; read-only, to browse the catalog and copy what you need. Right page, the front door: with the Ark switched on, its web server shows the whole library in a browser to phones and laptops nearby; request more, chat, send mail, ask the assistant; open to your LAN and tailnet, never to the internet. Both work with no internet at all.</desc><style>
.s{fill:none;stroke:var(--a);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.t{stroke-width:2}.w{stroke-width:6}.f{fill:var(--a)}
.ch{font:700 12px system-ui,-apple-system,'Segoe UI',sans-serif;letter-spacing:.22em;fill:#d97706;text-transform:uppercase}
.tt{font:italic 600 30px Georgia,'Times New Roman',serif;fill:#1f2328}
.lb{font:600 15px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#1f2328}
.cp{font:13px system-ui,sans-serif;fill:#4b5563}
.sm{font:600 12px system-ui,sans-serif;fill:#1f2328}
.xs{font:11px system-ui,sans-serif;fill:#4b5563}
.it{font:italic 14px Georgia,'Times New Roman',serif;fill:#1f2328}
.h{paint-order:stroke;stroke:#fdf6e6;stroke-width:4px;stroke-linejoin:round}
.m{text-anchor:middle}.e{text-anchor:end}
.ld{fill:none;stroke:#8a7a5c;stroke-width:1.5;stroke-dasharray:2 4;stroke-linecap:round}
.go{offset-rotate:0deg;animation:go 9s linear infinite both}
.drift{animation:drift 26s ease-in-out infinite alternate}
.tw{animation:tw 4s ease-in-out infinite}
.pulse{transform-box:fill-box;transform-origin:50% 50%;animation:pulse 3s ease-in-out infinite}
.spin{transform-box:fill-box;transform-origin:50% 50%;animation:spin 14s linear infinite}
.rise{transform-box:fill-box;transform-origin:50% 100%;animation:rise 1.1s cubic-bezier(.2,.9,.3,1) both}
.bob{animation:bob 6s ease-in-out infinite}
.wave{animation:wave 7s linear infinite}
.win{animation:win 24s linear infinite both}
.pop{transform-box:fill-box;transform-origin:50% 50%;animation:pop .6s cubic-bezier(.3,1.4,.5,1) both}
.bar{transform-box:fill-box;transform-origin:0 50%;animation:bar 5s ease-in-out infinite}
.ring{animation:ring 2.4s ease-out infinite}
.sway{transform-box:fill-box;transform-origin:50% 0;animation:sway 5s ease-in-out infinite alternate}
@keyframes go{0%{offset-distance:0%;opacity:0}8%,90%{opacity:1}100%{offset-distance:100%;opacity:0}}
@keyframes drift{to{transform:translateX(26px)}}
@keyframes tw{50%{opacity:.25}}
@keyframes pulse{50%{transform:scale(1.35);opacity:.35}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rise{from{transform:scaleY(0)}}
@keyframes bob{50%{transform:translateY(46px)}}
@keyframes wave{to{transform:translateX(-80px)}}
@keyframes pop{from{transform:scale(.3);opacity:0}}
@keyframes bar{0%{transform:scaleX(.04)}70%,100%{transform:none}}
@keyframes ring{0%{opacity:0}30%{opacity:1}100%{opacity:.15}}
@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
@keyframes win{0%,30%,100%{opacity:.28}3%,14%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.go{display:none}}
@supports not (offset-path:path('M0 0')){.go{display:none}}
</style><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfe6f5"/><stop offset="1" stop-color="#fdf3dc"/></linearGradient><clipPath id="page"><rect width="1200" height="560" rx="18"/></clipPath></defs><rect width="1200" height="560" rx="18" fill="url(#sky)"/><g clip-path="url(#page)"><rect x="52" y="112" width="1096" height="424" rx="14" fill="#8a5626"/><path d="M70 124C240 108 470 112 600 134V522C470 500 240 496 70 512Z" fill="#e9dcc3" stroke="#8a7a5c" stroke-width="1.5"/><path d="M1130 124C960 108 730 112 600 134V522C730 500 960 496 1130 512Z" fill="#e9dcc3" stroke="#8a7a5c" stroke-width="1.5"/><path d="M600 134V522" stroke="#8a7a5c" stroke-width="3" opacity=".6"/><path d="M560 130C580 132 590 134 600 138V522C590 512 580 508 560 506Z" fill="#dccdb0" opacity=".7"/><path d="M640 130C620 132 610 134 600 138V522C610 512 620 508 640 506Z" fill="#dccdb0" opacity=".7"/><path d="M593 132v414l7-9 7 9V132Z" fill="#c2553a"/><text x="112.0" y="176.0" class="ch">The side door</text><text x="112.0" y="204.0" class="it" style="font-size:21px">Plain pages, on any file share</text><g transform="translate(160.0 306.0) scale(1.5)" style="--a:#14b8a6"><path d="M-16-11v22a16 5 0 0 0 32 0v-22" class="s"/><ellipse cy="-11" rx="16" ry="5" class="s"/><path d="M-16 0a16 5 0 0 0 32 0" class="s"/><circle cx="10" cy="8" r="2" class="f"/></g><path d="M186 300C240 200 330 200 392 262" class="ld"/><g class="go" style="offset-path:path('M186 300C240 200 330 200 392 262');animation-duration:6s;animation-delay:0s"><path d="M-9-12h13l5 5v19h-18Z" fill="#fff8e7" stroke="#8a7a5c" stroke-width="1.5"/><path d="M-5-3h10M-5 2h10M-5 7h6" stroke="#8a7a5c" stroke-width="1.5"/></g><g class="go" style="offset-path:path('M186 300C240 200 330 200 392 262');animation-duration:6s;animation-delay:2s"><path d="M-9-12h13l5 5v19h-18Z" fill="#fff8e7" stroke="#8a7a5c" stroke-width="1.5"/><path d="M-5-3h10M-5 2h10M-5 7h6" stroke="#8a7a5c" stroke-width="1.5"/></g><g class="go" style