0.0" y="340.0" class="lb m">The box itself</text><text x="600.0" y="359.0" class="cp m">always the Admin</text><path d="M584 426v-18a16 16 0 0 1 32 0v18Z" fill="#6e4722" stroke="#5d7391" stroke-width="2"/><g transform="translate(600.0 454.0) scale(0.6)" style="--a:#eab308"><circle cx="-9" cy="0" r="8" class="s"/><circle cx="-9" cy="0" r="2.5" class="f"/><path d="M-1 0h20M13 0v6M18 0v5" class="s"/></g><text x="600.0" y="484.0" class="sm h m">In with the admin passcode</text><text x="600.0" y="500.0" class="xs h m">settings, repair, moderation</text><text x="600.0" y="176.0" class="ch h m">Your network</text><text x="600.0" y="196.0" class="cp h m">the LAN and your tailnet</text><g transform="translate(372.0 296.0) scale(1.0)" style="--a:#3b82f6"><path d="M0-11C-6-15-14-15-20-13v25c6-2 14-2 20 2zM0-11C6-15 14-15 20-13v25c-6-2-14-2-20 2z" class="s"/><path d="M-15-7h9M-15-2h9M6-7h9" class="s t"/></g><text x="372.0" y="334.0" class="sm h m">Browse and read</text><text x="372.0" y="351.0" class="xs h m">the library, if the mode allows</text><g transform="translate(836.0 296.0) scale(1.0)" style="--a:#22c55e"><rect x="-19" y="-14" width="38" height="28" rx="5" class="s"/><path d="M-5-7v14l11-7z" class="f"/></g><text x="836.0" y="334.0" class="sm h m">Request more</text><text x="836.0" y="351.0" class="xs h m">one tap, if the mode allows</text><rect x="298.0" y="398" width="40" height="32" fill="#2a3d55" stroke="#5d7391"/><path d="M291.0 398L318 378L345.0 398Z" fill="#b4533a"/><rect x="310" y="410" width="16" height="16" rx="2" fill="#fcd34d" class="tw" style="animation-delay:-0s"/><rect x="432.0" y="444" width="40" height="32" fill="#2a3d55" stroke="#5d7391"/><path d="M425.0 444L452 424L479.0 444Z" fill="#b4533a"/><rect x="444" y="456" width="16" height="16" rx="2" fill="#fcd34d" class="tw" style="animation-delay:-1.5s"/><rect x="740.0" y="446" width="40" height="32" fill="#2a3d55" stroke="#5d7391"/><path d="M733.0 446L760 426L787.0 446Z" fill="#b4533a"/><rect x="752" y="4