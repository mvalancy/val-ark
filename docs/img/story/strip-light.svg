<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="Val Ark: One tap, four panels"><title>Val Ark: One tap, four panels</title><desc>A four-panel comic strip. 1: You tap Request (on any device nearby): one tap, on something, the Ark does not have yet. 2: Three questions (the web server checks first): on the LAN or tailnet?, within the rate limit?, allowed by the Use Mode?. 3: Pinned, then fitted (the librarian takes the job): pinned: never evicted, room is made only if it won't fit. 4: It lands (watch it on the activity page): resumable, size-checked, the loop keeps it there.</desc><style>
.s{fill:none;stroke:var(--a);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.t{stroke-width:2}.w{stroke-width:6}.f{fill:var(--a)}
.ch{font:700 12px system-ui,-apple-system,'Segoe UI',sans-serif;letter-spacing:.22em;fill:#d97706;text-transform:uppercase}
.tt{font:italic 600 30px Georgia,'Times New Roman',serif;fill:#1f2328}
.lb{font:600 15px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#1f2328}
.cp{font:13px system-ui,sans-serif;fill:#4b5563}
.sm{font:600 12px system-ui,sans-serif;fill:#1f2328}
.xs{font:11px system-ui,sans-serif;fill:#4b5563}
.it{font:italic 14px Georgia,'Times New Roman',serif;fill:#1f2328}
.h{paint-order:stroke;stroke:#fdf6e6;stroke-width:4px;stroke-linejoin:round}
.m{text-anchor:middle}.e{text-anchor:end}
.ld{fill:none;stroke:#8a7a5c;stroke-width:1.5;stroke-dasharray:2 4;stroke-linecap:round}
.go{offset-rotate:0deg;animation:go 9s linear infinite both}
.drift{animation:drift 26s ease-in-out infinite alternate}
.tw{animation:tw 4s ease-in-out infinite}
.pulse{transform-box:fill-box;transform-origin:50% 50%;animation:pulse 3s ease-in-out infinite}
.spin{transform-box:fill-box;transform-origin:50% 50%;animation:spin 14s linear infinite}
.rise{transform-box:fill-box;transform-origin:50% 100%;animation:rise 1.1s cubic-bezier(.2,.9,.3,1) both}
.bob{animation:bob 6s ease-in-out infinite}
.wave{animation:wave 7s linear infinite}
.win{animation:win 24s linear infinite both}
.pop{transform-box:fill-box;transform-origin:50% 50%;animation:pop .6s cubic-bezier(.3,1.4,.5,1) both}
.bar{transform-box:fill-box;transform-origin:0 50%;animation:bar 5s ease-in-out infinite}
.ring{animation:ring 2.4s ease-out infinite}
.sway{transform-box:fill-box;transform-origin:50% 0;animation:sway 5s ease-in-out infinite alternate}
@keyframes go{0%{offset-distance:0%;opacity:0}8%,90%{opacity:1}100%{offset-distance:100%;opacity:0}}
@keyframes drift{to{transform:translateX(26px)}}
@keyframes tw{50%{opacity:.25}}
@keyframes pulse{50%{transform:scale(1.35);opacity:.35}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rise{from{transform:scaleY(0)}}
@keyframes bob{50%{transform:translateY(46px)}}
@keyframes wave{to{transform:translateX(-80px)}}
@keyframes pop{from{transform:scale(.3);opacity:0}}
@keyframes bar{0%{transform:scaleX(.04)}70%,100%{transform:none}}
@keyframes ring{0%{opacity:0}30%{opacity:1}100%{opacity:.15}}
@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
@keyframes win{0%,30%,100%{opacity:.28}3%,14%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.go{display:none}}
@supports not (offset-path:path('M0 0')){.go{display:none}}
</style><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfe6f5"/><stop offset="1" stop-color="#fdf3dc"/></linearGradient><clipPath id="page"><rect width="1200" height="560" rx="18"/></clipPath></defs><rect width="1200" height="560" rx="18" fill="url(#sky)"/><g clip-path="url(#page)"><g transform="rotate(-1.2 175 320.0)"><g class="pop" style="animation-delay:0.2s"><rect x="44" y="124" width="262" height="392" rx="6" fill="#e9dcc3" stroke="#1f2328" stroke-width="3.5"/><rect x="56" y="112" width="202" height="30" rx="3" fill="#fff8e7" stroke="#1f2328" stroke-width="2"/><text x="66" y="132" class="sm" style="fill:#2a1a04">On any device nearby</text><circle cx="284" cy="128" r="17" fill="#3b82f6" stroke="#1f2328" stroke-width="2.5"/><text x="284" y="134" class="lb m" style="fill:#fff">1</text><rect x="127" y="178" width="96" height="176" rx="14" fill="#1f2328"/><rect x="135" y="192" width="80" height="148" rx="5" fill="#fdf6e6"/><g transform="translate(175.0 230.0) scale(0.9)" style="--a:#3b82f6"><path d="M0-11C-6-15-14-15-20-13v25c6-2 14-2 20 2zM0-11C6-15 14-15 20-13v25c-6-2-14-2-20 2z" class="s"/><path d="M-15-7h9M-15-2h9M6-7h9" class="s t"/></g><rect x="145" y="262" width="60" height="7" rx="3" fill="#4b5563"/><rect x="145" y="276" width="42" height="7" rx="3" fill="#4b5563"/><rect x="143" y="300" width="64" height="24" rx="12" fill="#f59e0b"/><text x="175" y="317" class="sm m" style="fill:#2a1a04">Request</text><circle cx="197" cy="318" r="15" fill="none" stroke="#3b82f6" stroke-width="3" class="pulse"/><text x="175.0" y="390.0" class="it m" style="font-size:20px">You tap Request</text><text x="175.0" y="420.0" class="cp m">one tap, on something</text><text x="175.0" y="441.0" class="cp m">the Ark does not have yet</text></g></g><g transform="rotate(0.9 458 320.0)"><g class="pop" style="animation-delay:0.7s"><rect x="327" y="124" width="262" height="392" rx="6" fill="#e9dcc3" stroke="#1f2328" stroke-width="3.5"/><rect x="339" y="112" width="202" height="30" rx="3" fill="#fff8e7" stroke="#1f2328" stroke-width="2"/><text x="349" y="132" class="sm" style="fill:#2a1a04">The web server checks first</text><circle cx="567" cy="128" r="17" fill="#22c55e" stroke="#1f2328" stroke-width="2.5"/><text x="567" y="134" class="lb m" style="fill:#fff">2</text><g transform="translate(458.3 234.0) scale(2.3)" style="--a:#22c55e"><path d="M0-18 15-12V0c0 10-7 16-15 19-8-3-15-9-15-19v-12z" class="s"/><path d="m-6 1 4 5 9-10" class="s"/></g><g class="tw" style="animation-delay:-0.0s"><g transform="translate(414.3 326.0) scale(0.7)" style="--a:#22c55e"><circle r="16" class="s"/><path d="m-7 0 5 6 10-11" class="s"/></g></g><g class="tw" style="animation-delay:-1.3s"><g transform="translate(458.3 326.0) scale(0.7)" style="--a:#22c55e"><circle r="16" class="s"/><path d="m-7 0 5 6 10-11" class="s"/></g></g><g class="tw" style="animation-delay:-2.6s"><g transform="translate(502.3 326.0) scale(0.7)" style="--a:#22c55e"><circle r="16" class="s"/><path d="m-7 0 5 6 10-11" class="s"/></g></g><text x="458.3" y="390.0" class="it m" style="font-size:20px">Three questions</text><text x="458.3" y="420.0" class="cp m">on the LAN or tailnet?</text><text x="458.3" y="441.0" class="cp m">within the rate limit?</text><text x="458.3" y="462.0" class="cp m">allowed by the Use Mode?</text></g></g><g transform="rotate(-0.7 742 320.0)"><g class="pop" style="animation-delay:1.2s"><rect x="611" y="124" width="262" height="392" rx="6" fill="#e9dcc3" stroke="#1f2328" stroke-width="3.5"/><rect x="623" y="112" width="202" height="30" rx="3" fill="#fff8e7" stroke="#1f2328" stroke-width="2"/><text x="633" y="132" class="sm" style="fill:#2a1a04">The Librarian takes the job</text><circle cx="851" cy="128" r="17" fill="#f97316" stroke="#1f2328" stroke-width="2.5"/><text x="851" y="134" class="lb m" style="fill:#fff">3</text><path d="M641 336H843" stroke="#1f2328" stroke-width="5" stroke-linecap="round"/><rect x="646" y="280" width="44" height="54" rx="3" fill="#dccdb0" stroke="#8a7a5c" stroke-width="2"/><rect x="794" y="270" width="44" height="64" rx="3" fill="#dccdb0" stroke="#8a7a5c" stroke-width="2"/><rect x="702" y="254" width="80" height="80" rx="4" fill="#b97c42" stroke="#8a5626" stroke-width="3"/><path d="M702 254l80 80M782 254l-80 80" stroke="#8a5626" stroke-width="2.5"/><g class="sway"><path d="M742 196v52" stroke="#1f2328" stroke-width="3" stroke-linecap="round"/><circle cx="742" cy="190" r="13" fill="#c2553a" stroke="#1f2328" stroke-width="2.5"/></g><text x="741.6" y="390.0" class="it m" style="font-size:20px">Pinned, then fitted</text><text x="741.6" y="420.0" class="cp m">pinned: never evicted</text><text x="741.6" y="441.0" class="cp m">room is made only if it won't fit</text></g></g><g transform="rotate(1.1 1025 320.0)"><g class="pop" style="animation-delay:1.7s"><rect x="894" y="124" width="262" height="392" rx="6" fill="#e9dcc3" stroke="#1f2328" stroke-width="3.5"/><rect x="906" y="112" width="202" height="30" rx="3" fill="#fff8e7" stroke="#1f2328" stroke-width="2"/><text x="916" y="132" class="sm" style="fill:#2a1a04">Watch it on the Activity page</text><circle cx="1134" cy="128" r="17" fill="#14b8a6" stroke="#1f2328" stroke-width="2.5"/><text x="1134" y="134" class="lb m" style="fill:#fff">4</text><g transform="translate(1024.9 230.0) scale(1.9)" style="--a:#14b8a6"><path d="M0-11C-6-15-14-15-20-13v25c6-2 14-2 20 2zM0-11C6-15 14-15 20-13v25c-6-2-14-2-20 2z" class="s"/><path d="M-15-7h9M-15-2h9M6-7h9" class="s t"/></g><rect x="933" y="300" width="184" height="20" rx="10" fill="#fdf6e6" stroke="#1f2328" stroke-width="2.5"/><rect x="937" y="304" width="176" height="12" rx="6" fill="#14b8a6" class="bar"/><text x="1024.9" y="390.0" class="it m" style="font-size:20px">It lands</text><text x="1024.9" y="420.0" class="cp m">resumable, size-checked</text><text x="1024.9" y="441.0" class="cp m">the loop keeps it there</text></g></g></g><text x="56" y="46" class="ch h">Chapter 5</text><text x="56" y="82" class="tt h">One tap, four panels</text></svg>
