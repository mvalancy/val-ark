n-delay:0.95s"><ellipse cx="540" cy="310" rx="34" ry="12" fill="#000" opacity=".18"/><circle cx="540" cy="304" r="30" fill="#e9dcc3" stroke="#a855f7" stroke-width="4"/><g transform="translate(540.0 304.0) scale(0.78)" style="--a:#a855f7"><rect x="-14" y="-3" width="28" height="21" rx="4" class="s"/><path d="M-8-3v-6a8 8 0 0 1 16 0v6" class="s"/><circle cy="6" r="3" class="f"/><path d="M0 8v5" class="s"/></g><circle cx="514" cy="280" r="11" fill="#a855f7"/><text x="514" y="284" class="sm m" style="fill:#fff">4</text></g><text x="540.0" y="358.0" class="lb h m">Admin passcode</text><text x="540.0" y="376.0" class="cp h m">you can skip it</text><g class="pop" style="animation-delay:1.20s"><ellipse cx="672" cy="426" rx="34" ry="12" fill="#000" opacity=".18"/><circle cx="672" cy="420" r="30" fill="#e9dcc3" stroke="#ef4444" stroke-width="4"/><g transform="translate(672.0 420.0) scale(0.78)" style="--a:#ef4444"><path d="M-19-5a27 27 0 0 1 38 0M-12 3a17 17 0 0 1 24 0M-5 10a7 7 0 0 1 10 0" class="s"/><circle cy="15" r="2.5" class="f"/></g><circle cx="646" cy="396" r="11" fill="#ef4444"/><text x="646" y="400" class="sm m" style="fill:#fff">5</text></g><text x="672.0" y="474.0" class="lb h m">Who can use it</text><text x="672.0" y="492.0" class="cp h m">open, or signed in</text><g class="pop" style="animation-delay:1.45s"><ellipse cx="822" cy="402" rx="34" ry="12" fill="#000" opacity=".18"/><circle cx="822" cy="396" r="30" fill="#e9dcc3" stroke="#14b8a6" stroke-width="4"/><g transform="translate(822.0 396.0) scale(0.78)" style="--a:#14b8a6"><path d="M-14 14C-14-6-2-15 15-15c0 17-9 29-29 29zM-14 14 6-6" class="s"/></g><circle cx="796" cy="372" r="11" fill="#14b8a6"/><text x="796" y="376" class="sm m" style="fill:#fff">6</text></g><text x="822.0" y="450.0" class="lb h m">Focus</text><text x="822.0" y="468.0" class="cp h m">survival, AI, tools…</text><g class="pop" style="animation-delay:1.70s"><ellipse cx="944" cy="292" rx="34" ry="12" fill="#000" opacity=".18"/><circle cx="944" cy="286" r="30" fill="#e9dcc3" stroke="#eab308" stroke-width="4"/><g transform="translate(944.0 286.0) scale(0.78)" style="--a:#eab308"><circle r="16" class="s"/><path d="m-7 0 5 6 10-11" class="s"/></g><circle cx="918" cy="262" r="11" fill="#eab308"/><text x="918" y="266" class="sm m" style="fill:#fff">7</text></g><text x="944.0" y="340.0" class="lb h m">Ready to go</text><text x="944.0" y="358.0" class="cp h m">review, then Set up</text><g class="pop" style="animation-delay:1.95s"><ellipse cx="1086" cy="218" rx="34" ry="12" fill="#000" opacity=".18"/><circle cx="1086" cy="212" r="30" fill="#e9dcc3" stroke="#ec4899" stroke-width="4"/><g transform="translate(1086.0 212.0) scale(0.78)" style="--a:#ec4899"><rect x="-14" y="-13" width="28" height="31" rx="3" class="s"/><rect x="-7" y="-18" width="14" height="8" rx="2" class="f"/><path d="M-8-1h16M-8 6h16M-8 13h9" class="s t"/></g><circle cx="1060" cy="188" r="11" fill="#ec4899"/><text x="1060" y="192" class="sm m" style="fill:#fff">8</text></g><text x="1086.0" y="266.0" class="lb h m">All set</text><text x="1086.0" y="284.0" class="cp h m">save the recovery card</text><path d="M1120 216V150" stroke="#1f2328" stroke-width="3" stroke-linecap="round"/><path d="M1121 150l34 11-34 11Z" fill="#c2553a" class="sway"/><g class="go" style="offset-path:path('M110 440C134 425 205 384 252 352C299 320 344 258 392 250C440 242 493 276 540 304C587 332 625 405 672 420C719 435 777 418 822 396C867 374 900 317 944 286C988 255 1062 224 1086 212');animation-duration:18s"><circle r="11" fill="#f59e0b" stroke="#1f2328" stroke-width="2.5"/><circle r="22" fill="#f59e0b" opacity=".3"/></g><text x="1144.0" y="520.0" class="it h e">The first fill starts at the flag. Install the loop to keep it filling.</text></g><text x="56" y="46" class="ch h">Chapter 7</text><text x="56" y="82" class="tt h">The trail to a working Ark</text></svg>
