<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="Val Ark: One Ark, end to end"><title>Val Ark: One Ark, end to end</title><desc>A landscape. On the left a cloud, the internet while it lasts, rains books (Wikipedia and more), AI models, and apps and installers into an ark on a hill. On the Ark the Librarian picks what fits, one disk holds it all, and the loop mends it every 30 minutes. A road leads down to a village, your network, which gets the web UI in any browser and plain pages on a file share, with no internet needed.</desc><style>
.s{fill:none;stroke:var(--a);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.t{stroke-width:2}.w{stroke-width:6}.f{fill:var(--a)}
.ch{font:700 12px system-ui,-apple-system,'Segoe UI',sans-serif;letter-spacing:.22em;fill:#f59e0b;text-transform:uppercase}
.tt{font:italic 600 30px Georgia,'Times New Roman',serif;fill:#e6edf3}
.lb{font:600 15px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#e6edf3}
.cp{font:13px system-ui,sans-serif;fill:#a3b1bf}
.sm{font:600 12px system-ui,sans-serif;fill:#e6edf3}
.xs{font:11px system-ui,sans-serif;fill:#a3b1bf}
.it{font:italic 14px Georgia,'Times New Roman',serif;fill:#e6edf3}
.h{paint-order:stroke;stroke:#0f1b2b;stroke-width:4px;stroke-linejoin:round}
.m{text-anchor:middle}.e{text-anchor:end}
.ld{fill:none;stroke:#5d7391;stroke-width:1.5;stroke-dasharray:2 4;stroke-linecap:round}
.go{offset-rotate:0deg;animation:go 9s linear infinite both}
.drift{animation:drift 26s ease-in-out infinite alternate}
.tw{animation:tw 4s ease-in-out infinite}
.pulse{transform-box:fill-box;transform-origin:50% 50%;animation:pulse 3s ease-in-out infinite}
.spin{transform-box:fill-box;transform-origin:50% 50%;animation:spin 14s linear infinite}
.rise{transform-box:fill-box;transform-origin:50% 100%;animation:rise 1.1s cubic-bezier(.2,.9,.3,1) both}
.bob{animation:bob 6s ease-in-out infinite}
.wave{animation:wave 7s linear infinite}
.win{animation:win 24s linear infinite both}
.fade{animation:fade .8s ease-out both}
@keyframes go{0%{offset-distance:0%;opacity:0}8%,90%{opacity:1}100%{offset-distance:100%;opacity:0}}
@keyframes drift{to{transform:translateX(26px)}}
@keyframes tw{50%{opacity:.25}}
@keyframes pulse{50%{transform:scale(1.35);opacity:.35}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rise{from{transform:scaleY(0)}}
@keyframes bob{50%{transform:translateY(46px)}}
@keyframes wave{to{transform:translateX(-80px)}}
@keyframes win{0%,30%,100%{opacity:.28}3%,14%{opacity:1}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.go{display:none}}
@supports not (offset-path:path('M0 0')){.go{display:none}}
