ext><text x="371.5" y="489.0" class="xs m">for new nodes</text><rect x="436.0" y="230" width="54" height="164" fill="#dccdb0" stroke="#8a7a5c" stroke-width="2"/><path d="M430.0 230L463.0 196L496.0 230Z" fill="#c2553a"/><path d="M454.0 268v-16a9 9 0 0 1 18 0v16Z" fill="#f59e0b" class="win" style="animation-delay:8.26s"/><g transform="translate(463.0 362.0) scale(0.52)" style="--a:#ef4444"><path d="m-19-11 12-5 14 5 12-5v27l-12 5-14-5-12 5z" class="s"/><path d="M-7-16v27M7-11v27" class="s t"/></g><path d="M463.0 396V410" class="ld"/><text x="463.0" y="424.0" class="sm m">Refresh</text><text x="463.0" y="439.0" class="xs m">live catalogs</text><rect x="527.5" y="246" width="54" height="148" fill="#dccdb0" stroke="#8a7a5c" stroke-width="2"/><path d="M524.5 246v-12h14v12h9v-12h14v12h9v-12h14v12Z" fill="#dccdb0" stroke="#8a7a5c" stroke-width="1.5"/><path d="M545.5 284v-16a9 9 0 0 1 18 0v16Z" fill="#f59e0b" class="win" style="animation-delay:10.22s"/><g transform="translate(554.5 362.0) scale(0.52)" style="--a:#14b8a6"><circle cx="-4" cy="-4" r="11" class="s"/><path d="m4 4 11 11" class="s w"/></g><path d="M554.5 396V460" class="ld"/><text x="554.5" y="474.0" class="sm m">Fix dead links</text><text x="554.5" y="489.0" class="xs m">tool, installer URLs</text><rect x="619.0" y="258" width="54" height="136" fill="#dccdb0" stroke="#8a7a5c" stroke-width="2"/><path d="M613.0 258L646.0 224L679.0 258Z" fill="#c2553a"/><path d="M637.0 296v-16a9 9 0 0 1 18 0v16Z" fill="#f59e0b" class="win" style="animation-delay:12.19s"/><g transform="translate(646.0 362.0) scale(0.52)" style="--a:#eab308"><circle r="16" class="s"/><path d="m-7 0 5 6 10-11" class="s"/></g><path d="M646.0 396V410" class="ld"/><text x="646.0" y="424.0" class="sm m">Check files</text><text x="646.0" y="439.0" class="xs m">sizes, re-fetch short</text><rect x="710.5" y="230" width="54" height="164" fill="#dccdb0" stroke="#8a7a5c" stroke-width="2"/><path d="M707.5 230v-12h14v12h9v-12h14v12h9v-12h14v12Z" fill="#dccdb0" str